name: APK Derle

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Android SDK ubuntu-latest üzerinde hazır gelir (ANDROID_HOME).
      - run: npm ci
      - run: npm test
      - run: npx vite build && npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ORCA-Fatura-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Telefondan tek dokunuşla indirmek için Releases sayfasına koy.
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ORCA-Fatura.apk
          gh release delete apk-son --cleanup-tag --yes || true
          gh release create apk-son ORCA-Fatura.apk --target "$GITHUB_SHA" \
            --title "OR-ÇA Fatura (son sürüm)" --notes "Telefona indirip kurun: ORCA-Fatura.apk"
